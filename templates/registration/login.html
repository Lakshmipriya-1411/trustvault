{% extends "base.html" %}
{% block title %}Log in - TrustVault{% endblock %}
{% block content %}
  <h2>Log in</h2>
  {% if form.errors %}
    <p class="error">Invalid username or password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username</label>
    {{ form.username }}
    <label>Password</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
{% endblock %}
